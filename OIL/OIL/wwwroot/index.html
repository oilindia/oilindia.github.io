<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OIL Systems</title>
    <base href="/" />

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:Roboto, sans-serif;">
            <div style="text-align:center;">
                <div class="loader-spinner"></div>
                <p style="margin-top:10px;">Loading OIL Systems...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/chart-functions.js"></script>
    <script src="js/pmdbjs.js"></script>
    <script src="js/costcharts.js"></script>


    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <style>
        .loader-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #E21E26; /* Changed to match your brand red */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Ensure Error UI stays on top of everything */
        #blazor-error-ui {
            background: #fff3cd;
            bottom: 0;
            display: none;
            left: 0;
            padding: 15px;
            position: fixed;
            width: 100%;
            z-index: 5000;
        }
    </style>
</body>
</html>
