<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OIL Systems</title>
    <base href="/" />

    <script type="text/javascript">
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location));
    </script>

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/x-icon" href="favicon.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:Roboto, sans-serif;">
            <div style="text-align:center;">
                <div class="loader-spinner"></div>
                <p style="margin-top:10px;">Loading OIL Systems...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.getElementDimensions = (el) => {
            if (!el) return { width: 0, height: 0 };
            return { width: el.offsetWidth, height: el.offsetHeight };
        };

        window.scrollToMarker = (containerId, xPercent, yPercent) => {
            const map = document.getElementById(containerId);
            const container = map ? map.parentElement : null;
            if (container && map) {
                const x = (map.clientWidth * (xPercent / 100)) - (container.clientWidth / 2);
                const y = (map.clientHeight * (yPercent / 100)) - (container.clientHeight / 2);
                container.scrollTo({ top: y, left: x, behavior: 'smooth' });
            }
        };

        window.scrollChatBottom = function () {
            let el = document.getElementById("chat-container");
            if (el) { el.scrollTop = el.scrollHeight; }
        };


        window.initAllMaintenanceCharts = () => {
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'bottom' } },
                scales: { x: { grid: { display: false } } }
            };

            // 1. PM Jobs In Days (Line)
            new Chart(document.getElementById('chartPmDays'), {
                type: 'line',
                data: {
                    labels: ['2023-24', '2024-25', '2025-26'],
                    datasets: [{ label: 'PM Days', data: [450, 520, 610], borderColor: '#3b82f6', tension: 0.3 }]
                },
                options: commonOptions
            });

            // 2. Total PM Jobs Count (Bar)
            new Chart(document.getElementById('chartPmCount'), {
                type: 'bar',
                data: {
                    labels: ['2023-24', '2024-25', '2025-26'],
                    datasets: [{ label: 'Job Count', data: [120, 155, 190], backgroundColor: '#f59e0b' }]
                },
                options: commonOptions
            });

            // 3. PM % of Total Jobs (Line)
            new Chart(document.getElementById('chartPmPercent'), {
                type: 'line',
                data: {
                    labels: ['2023-24', '2024-25', '2025-26'],
                    datasets: [{ label: 'PM %', data: [25, 32, 38], borderColor: '#10b981', fill: true, backgroundColor: 'rgba(16, 185, 129, 0.1)' }]
                },
                options: commonOptions
            });

            // 4. YoY Growth (Bar)
            new Chart(document.getElementById('chartYoY'), {
                type: 'bar',
                data: {
                    labels: ['2024-25', '2025-26'],
                    datasets: [{ label: 'Growth %', data: [15, 22], backgroundColor: '#8b5cf6' }]
                },
                options: commonOptions
            });

            // 5. Field-wise PM Jobs
            new Chart(document.getElementById('chartFieldPm'), {
                type: 'bar',
                data: {
                    labels: ['Central Field', 'Western Field', 'Eastern Field'],
                    datasets: [{ label: 'Jobs', data: [85, 60, 45], backgroundColor: ['#0f172a', '#334155', '#64748b'] }]
                },
                options: commonOptions
            });

            // 6. PM vs Non-PM (Grouped Bar)
            new Chart(document.getElementById('chartPmVsNonPm'), {
                type: 'bar',
                data: {
                    labels: ['2023-24', '2024-25', '2025-26'],
                    datasets: [
                        { label: 'PM', data: [120, 155, 190], backgroundColor: '#f59e0b' },
                        { label: 'Non-PM', data: [300, 280, 250], backgroundColor: '#cbd5e1' }
                    ]
                },
                options: commonOptions
            });

            // 7. Stacked Job Mix
            new Chart(document.getElementById('chartStackedMix'), {
                type: 'bar',
                data: {
                    labels: ['2023-24', '2024-25', '2025-26'],
                    datasets: [
                        { label: 'PM', data: [30, 40, 50], backgroundColor: '#f59e0b' },
                        { label: 'Breakdown', data: [70, 60, 50], backgroundColor: '#ef4444' }
                    ]
                },
                options: { ...commonOptions, scales: { x: { stacked: true }, y: { stacked: true } } }
            });

            // 8. Maintenance Trends with PM % (Dual Axis)
            new Chart(document.getElementById('chartDualAxis'), {
                type: 'line',
                data: {
                    labels: ['2023-24', '2024-25', '2025-26'],
                    datasets: [
                        { label: 'Total Jobs', data: [420, 435, 440], borderColor: '#3b82f6', yAxisID: 'y' },
                        { label: 'PM %', data: [25, 32, 38], borderColor: '#f59e0b', yAxisID: 'y1', borderDash: [5, 5] }
                    ]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        y: { type: 'linear', position: 'left' },
                        y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false } }
                    }
                }
            });

            // 9. Total OverTime (OT)
            new Chart(document.getElementById('chartOT'), {
                type: 'bar',
                data: {
                    labels: ['2023-24', '2024-25', '2025-26'],
                    datasets: [{ label: 'OT Hours', data: [1200, 1150, 980], backgroundColor: '#334155' }]
                },
                options: commonOptions
            });
        };

        window.setupCharts = () => {
            const barCtx = document.getElementById('barChart')?.getContext('2d');
            if (barCtx) {
                new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Maintenance', 'Employee OT', 'Transport'],
                        datasets: [
                            { label: 'Q1 & Q2', data: [952, 27.98, 54.75], backgroundColor: '#d1e4f6' },
                            { label: 'Q3 & Q4', data: [790, 17.90, 52.54], backgroundColor: '#d32f2f' }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }


            const CPDbarCtx = document.getElementById('CPDbarChart')?.getContext('2d');
            if (CPDbarCtx) {
                new Chart(CPDbarCtx, {
                    type: 'bar',
                    data: {
                        labels: ['2 May', '1 May', '30 Apr', '29 Apr', '28 Apr', '27 Apr', '26 Apr'],

                        /*labels: ['Maintenance', 'Employee OT', 'Transport'],*/
                        datasets: [
                            //{ label: 'Q1 & Q2', data: [952, 27.98, 54.75], backgroundColor: '#d1e4f6' },
                            //{ label: 'Q3 & Q4', data: [790, 17.90, 52.54], backgroundColor: '#d32f2f' }
                            { label: 'Dates', data: [4, 3.92, 3.2, 3.98, 2.60, 3.90, 0.52], backgroundColor: '#d32f2f' }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }


            const quarterlyCtx = document.getElementById('quarterlyCostChart')?.getContext('2d');

            if (quarterlyCtx) {
                new Chart(quarterlyCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Q1', 'Q2', 'Q3', 'Q4'],
                        datasets: [
                            {
                                label: 'Cost (₹ Crores)',
                                data: [4.1, 3.98, 3.7, 4.2],
                                backgroundColor: ['#2e7d32', '#1565c0', '#f9a825', '#d32f2f'],
                                // These settings ensure bars fill the width fully with no white space
                                categoryPercentage: 1.0,
                                barPercentage: 1.0
                            }
                        ]
                    },
                    options: {
                        indexAxis: 'y', // Makes the bar chart horizontal
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: { beginAtZero: true },
                            y: { grid: { display: false } }
                        }
                    }
                });
            }

            const donutCtx = document.getElementById('donutChart')?.getContext('2d');
            if (donutCtx) {
                new Chart(donutCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Maintenance ₹162L', 'Transport ₹2.21L', 'OT ₹10.08L'],
                        datasets: [{
                            data: [162, 2.21, 10.08],
                            backgroundColor: ['#d32f2f', '#b0892d', '#20548a'],
                            borderWidth: 2
                        }]
                    },
                    options: { cutout: '70%', plugins: { legend: { position: 'bottom' } } }
                });
            }
        };

        window.setupReductionCharts = () => {
            const ctxReduction = document.getElementById('reductionChart')?.getContext('2d');
            if (ctxReduction) {
                new Chart(ctxReduction, {
                    type: 'bar',
                    data: {
                        labels: ['Maintenance', 'Employee OT', 'Transport', 'Overall'],
                        datasets: [{
                            axis: 'y',
                            data: [17.0, 36.9, 4.0, 16.8],
                            backgroundColor: ['#d32f2f', '#20548a', '#b0892d', '#1a7f4e'],
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { suggestedMax: 40 } }
                    }
                });
            }

            const ctxOT = document.getElementById('otHoursChart')?.getContext('2d');
            if (ctxOT) {
                new Chart(ctxOT, {
                    type: 'bar',
                    data: {
                        labels: ['Q1 & Q2', 'Q3 & Q4'],
                        datasets: [{
                            data: [4780, 4400],
                            backgroundColor: ['#d1e4f6', '#d32f2f'],
                            borderRadius: 4
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }
        };

        window.setupSavingsMixChart = () => {
            const ctxSavings = document.getElementById('savingsMixChart')?.getContext('2d');
            if (ctxSavings) {
                new Chart(ctxSavings, {
                    type: 'doughnut',
                    data: {
                        labels: ['PM & Spares', 'Transport', 'Technology', 'OT Control'],
                        datasets: [{
                            data: [60, 2, 30, 8],
                            backgroundColor: ['#d32f2f', '#b0892d', '#1a7f4e', '#20548a'],
                            borderWidth: 2
                        }]
                    },
                    options: { cutout: '60%', responsive: true, maintainAspectRatio: false }
                });
            }
        };
    </script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <style>
        .loader-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #594ae2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-bar-safe-area {
            height: env(safe-area-inset-top);
            background-color: transparent;
        }
    </style>
</body>

</html>
